<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">LifeLite 学习目标看板 · 桌面端界面草图</title>
  <desc id="wf-desc">顶栏包含等级、经验条与打卡按钮；统计区四项指标加七天趋势；左侧是目标列表（含进度条），右侧是选中目标下的任务列表。</desc>

  <defs>
    <style>
      text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .t { fill: #16202e; }
      .s { fill: #546174; }
      .m { fill: #8792a4; }
      .box { fill: #ffffff; stroke: #e4e9f2; }
      .dash { fill: none; stroke: #d3dae6; stroke-dasharray: 6 5; }
      .lbl { font-size: 13px; }
      .tiny { font-size: 11px; }
      .h { font-size: 16px; font-weight: 600; }
      .acc { fill: #2f6fed; }
    </style>
    <linearGradient id="exp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a86f7"/>
      <stop offset="1" stop-color="#2459c4"/>
    </linearGradient>
  </defs>

  <!-- 画布背景 -->
  <rect width="1200" height="820" fill="#f2f5f9"/>

  <!-- 顶栏 -->
  <rect x="0" y="0" width="1200" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#e4e9f2"/>
  <circle cx="52" cy="36" r="18" fill="#2f6fed"/>
  <path d="M44 37 l6 6 l11 -13" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="33" class="t" font-size="17" font-weight="700">LifeLite</text>
  <text x="82" y="51" class="m" font-size="11">学习目标看板</text>

  <text x="250" y="30" class="t lbl" font-weight="600">Lv.3 坚持者</text>
  <rect x="250" y="40" width="160" height="8" rx="4" fill="#e9effe"/>
  <rect x="250" y="40" width="96" height="8" rx="4" fill="url(#exp)"/>
  <text x="420" y="49" class="m" font-size="11">160 / 250 经验</text>
  <text x="250" y="66" class="m" font-size="10">再完成 <tspan class="acc">2</tspan> 个小任务就升级</text>

  <rect x="930" y="20" width="150" height="34" rx="17" fill="#2f6fed"/>
  <text x="965" y="42" fill="#ffffff" class="lbl">今天打卡 +5</text>
  <rect x="1096" y="20" width="80" height="34" rx="17" fill="#ffffff" stroke="#d3dae6"/>
  <text x="1111" y="42" class="s" font-size="12">快捷键</text>

  <!-- 统计区 -->
  <rect x="40" y="96" width="1120" height="132" rx="16" class="box"/>
  <text x="64" y="124" class="s" font-size="12" font-weight="600">本周概览</text>

  <!-- 四个统计卡片 -->
  <g>
    <rect x="64" y="136" width="180" height="68" rx="12" fill="#f7f9fc"/>
    <text x="80" y="160" class="m" font-size="11">本周完成</text>
    <text x="80" y="190" class="t" font-size="24" font-weight="700">7</text>
    <text x="104" y="190" class="m" font-size="11">个任务</text>

    <rect x="260" y="136" width="180" height="68" rx="12" fill="#f7f9fc"/>
    <text x="276" y="160" class="m" font-size="11">本周新增</text>
    <text x="276" y="190" class="t" font-size="24" font-weight="700">9</text>
    <text x="300" y="190" class="m" font-size="11">个任务</text>

    <rect x="456" y="136" width="180" height="68" rx="12" fill="#f7f9fc"/>
    <text x="472" y="160" class="m" font-size="11">整体完成率</text>
    <text x="472" y="190" class="t" font-size="24" font-weight="700">58%</text>
    <text x="528" y="190" class="m" font-size="11">34 / 58</text>

    <rect x="652" y="136" width="180" height="68" rx="12" fill="#f7f9fc"/>
    <text x="668" y="160" class="m" font-size="11">连续打卡</text>
    <text x="668" y="190" class="t" font-size="24" font-weight="700">12</text>
    <text x="700" y="190" class="m" font-size="11">天</text>
    <path d="M748 178 l5 -9 l5 13 l5 -17 l5 9 l5 -5" fill="none" stroke="#e0a008" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 七天趋势 -->
  <text x="856" y="160" class="m" font-size="11">最近七天完成</text>
  <g>
    <rect x="860" y="196" width="12" height="18" rx="3" fill="#c9d4e8"/>
    <rect x="884" y="182" width="12" height="32" rx="3" fill="#9db4e8"/>
    <rect x="908" y="196" width="12" height="18" rx="3" fill="#c9d4e8"/>
    <rect x="932" y="168" width="12" height="46" rx="3" fill="#3f7dfb"/>
    <rect x="956" y="190" width="12" height="24" rx="3" fill="#9db4e8"/>
    <rect x="980" y="160" width="12" height="54" rx="3" fill="#3f7dfb"/>
    <rect x="1004" y="150" width="12" height="64" rx="3" fill="#2459c4"/>
    <text x="862" y="232" class="m" font-size="9">一</text>
    <text x="886" y="232" class="m" font-size="9">二</text>
    <text x="910" y="232" class="m" font-size="9">三</text>
    <text x="934" y="232" class="m" font-size="9">四</text>
    <text x="958" y="232" class="m" font-size="9">五</text>
    <text x="982" y="232" class="m" font-size="9">六</text>
    <text x="1006" y="232" class="m" font-size="9">日</text>
  </g>

  <!-- 热力图 -->
  <text x="1064" y="160" class="m" font-size="11">打卡热力图</text>
  <g fill="#e8eef8">
    <rect x="1064" y="172" width="10" height="10" rx="2"/><rect x="1078" y="172" width="10" height="10" rx="2"/><rect x="1092" y="172" width="10" height="10" rx="2"/><rect x="1106" y="172" width="10" height="10" rx="2"/><rect x="1120" y="172" width="10" height="10" rx="2"/>
    <rect x="1064" y="186" width="10" height="10" rx="2"/><rect x="1078" y="186" width="10" height="10" rx="2"/><rect x="1092" y="186" width="10" height="10" rx="2"/><rect x="1106" y="186" width="10" height="10" rx="2"/><rect x="1120" y="186" width="10" height="10" rx="2"/>
    <rect x="1064" y="200" width="10" height="10" rx="2"/><rect x="1078" y="200" width="10" height="10" rx="2"/><rect x="1092" y="200" width="10" height="10" rx="2"/><rect x="1106" y="200" width="10" height="10" rx="2"/><rect x="1120" y="200" width="10" height="10" rx="2"/>
  </g>
  <g fill="#2f6fed">
    <rect x="1078" y="172" width="10" height="10" rx="2"/><rect x="1106" y="172" width="10" height="10" rx="2"/>
    <rect x="1064" y="186" width="10" height="10" rx="2"/><rect x="1092" y="186" width="10" height="10" rx="2"/><rect x="1120" y="186" width="10" height="10" rx="2"/>
    <rect x="1078" y="200" width="10" height="10" rx="2"/><rect x="1106" y="200" width="10" height="10" rx="2"/>
  </g>
  <rect x="1120" y="200" width="10" height="10" rx="2" fill="#2f6fed" stroke="#16202e" stroke-width="1.4"/>

  <!-- 左栏：目标 -->
  <rect x="40" y="252" width="480" height="540" rx="16" class="box"/>
  <text x="64" y="284" class="t" font-size="15" font-weight="600">我的目标</text>
  <text x="150" y="284" class="m" font-size="11">按创建时间，新的在最上面</text>

  <!-- tabs -->
  <rect x="64" y="298" width="76" height="28" rx="14" fill="#2f6fed"/>
  <text x="86" y="317" fill="#ffffff" font-size="12">进行中</text>
  <text x="158" y="317" class="s" font-size="12">已归档</text>
  <rect x="404" y="296" width="92" height="32" rx="16" fill="#2f6fed"/>
  <text x="422" y="317" fill="#ffffff" font-size="12">+ 新建目标</text>

  <!-- 目标卡片 1（选中） -->
  <rect x="60" y="344" width="440" height="150" rx="12" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
  <rect x="60" y="344" width="6" height="150" rx="3" fill="#17a673"/>
  <text x="80" y="372" class="t" font-size="15" font-weight="600">通过大学英语六级</text>
  <text x="80" y="394" class="s" font-size="11">每天 30 分钟听力，周末一套真题</text>
  <text x="80" y="416" class="m" font-size="10">截止 2026-12-20 · 12 个任务</text>
  <rect x="80" y="432" width="360" height="8" rx="4" fill="#eef2f8"/>
  <rect x="80" y="432" width="216" height="8" rx="4" fill="#3f7dfb"/>
  <text x="80" y="466" class="s" font-size="11">7 / 12 · 58%</text>
  <text x="330" y="368" class="acc" font-size="11">编辑 ✎</text>
  <text x="386" y="368" class="acc" font-size="11">归档 ▤</text>
  <text x="452" y="368" fill="#d0453d" font-size="11">✕</text>

  <!-- 目标卡片 2 -->
  <rect x="60" y="510" width="440" height="130" rx="12" fill="#ffffff" stroke="#e4e9f2"/>
  <rect x="60" y="510" width="6" height="130" rx="3" fill="#e0a008"/>
  <text x="80" y="538" class="t" font-size="15" font-weight="600">读完 12 本书</text>
  <text x="80" y="560" class="s" font-size="11">文学 / 社科各 6 本</text>
  <text x="80" y="582" class="m" font-size="10">截止 2027-01-15 · 4 个任务</text>
  <rect x="80" y="598" width="360" height="8" rx="4" fill="#eef2f8"/>
  <rect x="80" y="598" width="90" height="8" rx="4" fill="#c9d4e8"/>
  <text x="80" y="632" class="s" font-size="11">1 / 4 · 25%</text>

  <!-- 目标卡片 3（无任务空槽） -->
  <rect x="60" y="656" width="440" height="112" rx="12" fill="#ffffff" stroke="#e4e9f2"/>
  <rect x="60" y="656" width="6" height="112" rx="3" fill="#7b8794"/>
  <text x="80" y="684" class="t" font-size="15" font-weight="600">学会游泳</text>
  <text x="80" y="706" class="m" font-size="10">尚无任务</text>
  <rect x="80" y="722" width="360" height="8" rx="4" class="dash"/>
  <text x="80" y="754" class="m" font-size="11">尚未拆解</text>

  <!-- 右栏：任务 -->
  <rect x="544" y="252" width="616" height="540" rx="16" class="box"/>
  <text x="572" y="286" class="t" font-size="17" font-weight="600">通过大学英语六级</text>
  <text x="572" y="310" class="s" font-size="11">12 个任务，已完成 7 个 · 截止 2026-12-20</text>

  <!-- 任务区进度 -->
  <rect x="572" y="326" width="440" height="8" rx="4" fill="#eef2f8"/>
  <rect x="572" y="326" width="256" height="8" rx="4" fill="#3f7dfb"/>
  <text x="1026" y="334" class="s" font-size="11">58%</text>
  <rect x="1064" y="316" width="72" height="30" rx="15" fill="#2f6fed"/>
  <text x="1080" y="336" fill="#ffffff" font-size="12">+ 新建</text>

  <text x="572" y="366" class="m" font-size="10" font-weight="600">待完成 · 5</text>

  <!-- 任务行 -->
  <g>
    <!-- 行 1 -->
    <rect x="572" y="378" width="564" height="56" rx="10" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="596" cy="406" r="9" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.6"/>
    <text x="620" y="402" class="t" font-size="13">精听一套六级听力真题</text>
    <g>
      <rect x="620" y="412" width="34" height="16" rx="8" fill="#fdeceb"/><text x="628" y="423" fill="#d0453d" font-size="10">高</text>
      <rect x="662" y="412" width="44" height="16" rx="8" fill="#f7f9fc"/><text x="672" y="423" class="s" font-size="10">60 分</text>
      <rect x="714" y="412" width="86" height="16" rx="8" fill="#f7f9fc"/><text x="722" y="423" class="s" font-size="10">今天 21:00</text>
      <text x="812" y="424" class="acc" font-size="10">+20 经验</text>
    </g>
    <text x="1084" y="402" class="acc" font-size="11">✎</text>
    <text x="1108" y="402" fill="#d0453d" font-size="11">✕</text>

    <!-- 行 2 -->
    <rect x="572" y="444" width="564" height="56" rx="10" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="596" cy="472" r="9" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.6"/>
    <text x="620" y="468" class="t" font-size="13">背 40 个高频词</text>
    <g>
      <rect x="620" y="478" width="34" height="16" rx="8" fill="#fff6e3"/><text x="628" y="489" fill="#b3710b" font-size="10">中</text>
      <rect x="662" y="478" width="44" height="16" rx="8" fill="#f7f9fc"/><text x="672" y="489" class="s" font-size="10">15 分</text>
      <text x="716" y="490" class="acc" font-size="10">+10 经验</text>
    </g>

    <!-- 行 3（已逾期） -->
    <rect x="572" y="510" width="564" height="56" rx="10" fill="#ffffff" stroke="#e4e9f2"/>
    <circle cx="596" cy="538" r="9" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.6"/>
    <text x="620" y="534" class="t" font-size="13">做一套阅读真题</text>
    <g>
      <rect x="620" y="544" width="34" height="16" rx="8" fill="#fff6e3"/><text x="628" y="555" fill="#b3710b" font-size="10">中</text>
      <rect x="662" y="544" width="44" height="16" rx="8" fill="#f7f9fc"/><text x="672" y="555" class="s" font-size="10">90 分</text>
      <rect x="714" y="544" width="96" height="16" rx="8" fill="#fdeceb"/><text x="722" y="555" fill="#d0453d" font-size="10">已逾期 2 天</text>
      <text x="818" y="556" class="acc" font-size="10">+30 经验</text>
    </g>
  </g>

  <!-- 已完成折叠区 -->
  <line x1="572" y1="592" x2="1136" y2="592" stroke="#eef2f8"/>
  <text x="572" y="618" class="s" font-size="11">已完成 7 个</text>
  <text x="1060" y="618" class="acc" font-size="11">展开 ▾</text>

  <!-- 撤销 Toast -->
  <rect x="836" y="680" width="300" height="56" rx="12" fill="#16202e"/>
  <text x="856" y="704" fill="#ffffff" font-size="12">已删除任务「背 40 个高频词」</text>
  <text x="856" y="722" fill="#9fb0c8" font-size="10">10 秒内可以撤销</text>
  <rect x="1058" y="694" width="62" height="28" rx="14" fill="#ffffff"/>
  <text x="1070" y="713" class="t" font-size="11" font-weight="600">撤销</text>

  <!-- 说明标注 -->
  <text x="40" y="252" class="acc" font-size="11">① 左栏：目标卡片 + 进度</text>
  <text x="544" y="812" class="m" font-size="11">桌面端（&gt; 1024px）：左右两栏；平板（&lt; 1024px）上下堆叠；手机（&lt; 640px）一次只显示一栏，选中目标后进入任务栏。</text>
  <text x="40" y="812" class="m" font-size="11">草图仅表达布局与信息层级，最终样式以 css/style.css 为准。</text>
</svg>
