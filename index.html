<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLite 学习目标记事本</title>
  <meta name="description" content="橙色封面的翻页记事本：主任务逐行写下，子任务缩进跟随，每天翻一页，把想做的事一页一页写完。">
  <meta name="theme-color" content="#c86a22">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#sheet">跳到记事本</a>

  <main class="desk">
    <div class="book">
      <div class="book-pages">
        <article class="sheet" id="sheet" aria-live="polite"></article>
        <div class="flip" id="flip" aria-hidden="true"></div>
      </div>
      <div class="book-spine" aria-hidden="true"></div>
      <div class="book-shade" aria-hidden="true"></div>
    </div>

    <nav class="book-nav" aria-label="翻页">
      <button class="nav-btn" id="btn-prev" type="button">← 上一页</button>
      <button class="nav-page" id="page-indicator" type="button" aria-expanded="false" aria-controls="toc-menu" aria-label="打开目录">封面</button>
      <button class="nav-btn" id="btn-next" type="button">下一页 →</button>
    </nav>

    <p class="desk-hint">点页码看目录 · 点主任务展开子任务 · 方向键翻页 · N 新建主任务</p>
  </main>

  <div class="toc" id="toc-menu" hidden role="menu" aria-label="目录"></div>
  <div class="line-menu" id="line-menu" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <dialog class="dialog" id="goal-dialog">
    <form id="goal-form" novalidate>
      <h2 class="dialog-title" id="goal-dialog-title">新建主任务</h2>
      <label class="field">
        <span class="field-label">主任务名称<span class="req" aria-hidden="true">*</span></span>
        <input type="text" id="goal-title" maxlength="60" placeholder="例如：通过英语六级" autocomplete="off">
        <span class="field-hint">60 字以内，会逐行写进记事本</span>
      </label>
      <label class="field">
        <span class="field-label">备注</span>
        <textarea id="goal-desc" rows="3" maxlength="300" placeholder="为什么想完成它？做到了会怎样？"></textarea>
        <span class="field-hint">300 字以内，可留空</span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">截止日期</span>
          <input type="date" id="goal-due">
        </label>
        <fieldset class="field color-field">
          <legend class="field-label">标签颜色</legend>
          <div class="color-options" id="goal-colors"></div>
        </fieldset>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>取消</button>
        <button class="btn btn-primary" type="submit">写上去</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="task-dialog">
    <form id="task-form" novalidate>
      <h2 class="dialog-title" id="task-dialog-title">新建子任务</h2>
      <label class="field">
        <span class="field-label">子任务标题<span class="req" aria-hidden="true">*</span></span>
        <input type="text" id="task-title" maxlength="80" placeholder="例如：每天背 30 个单词" autocomplete="off">
        <span class="field-hint">80 字以内</span>
      </label>
      <label class="field">
        <span class="field-label">属于哪个主任务<span class="req" aria-hidden="true">*</span></span>
        <select id="task-goal"></select>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">优先级</span>
          <select id="task-priority">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">预计时长</span>
          <select id="task-estimate">
            <option value="">不填写</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
            <option value="90">90 分钟</option>
            <option value="120">120 分钟</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span class="field-label">截止时间</span>
        <input type="datetime-local" id="task-due">
        <span class="field-hint">过期未完成时标题会标红</span>
      </label>
      <p class="dialog-note">完成后获得 <strong id="task-exp-hint">20</strong> 点经验（不填时长按中任务计）</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>取消</button>
        <button class="btn btn-primary" type="submit">写上去</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog dialog-sm" id="confirm-dialog">
    <form id="confirm-form" novalidate>
      <h2 class="dialog-title" id="confirm-title">确认操作</h2>
      <p class="dialog-message" id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" type="submit" id="confirm-ok">确认</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/book.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
