<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLite 学习目标看板</title>
  <meta name="description" content="把一学期的长期目标拆成可执行的任务，每天打卡、完成任务获得经验值，用等级和连续天数把坚持这件事变得看得见。">
  <meta name="theme-color" content="#2f6fed">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#task-list">跳到任务列表</a>

  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icons/icon-192.png" alt="" width="34" height="34">
      <span class="brand-text">
        <strong>LifeLite</strong>
        <small>学习目标看板</small>
      </span>
    </div>

    <div class="level-card">
      <div class="level-line">
        <span class="level-name" id="level-name">Lv.1 起步者</span>
        <span class="level-exp" id="level-exp">0 / 100 经验</span>
      </div>
      <div class="exp-track" id="exp-track" role="progressbar" aria-label="当前等级经验" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="exp-fill" id="exp-fill"></div>
      </div>
    </div>

    <button class="btn btn-checkin" id="btn-checkin" type="button">
      <span class="checkin-icon" aria-hidden="true">✓</span>
      <span id="checkin-label">今日打卡</span>
    </button>
  </header>

  <section class="stats" aria-label="统计面板">
    <div class="stat">
      <span class="stat-label">本周完成</span>
      <strong class="stat-value" id="stat-week-done">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">本周新增</span>
      <strong class="stat-value" id="stat-week-new">0</strong>
    </div>
    <div class="stat">
      <span class="stat-label">整体完成率</span>
      <strong class="stat-value" id="stat-rate">0%</strong>
    </div>
    <div class="stat">
      <span class="stat-label">连续打卡</span>
      <strong class="stat-value" id="stat-streak">0 <small>天</small></strong>
    </div>
    <div class="stat stat-trend">
      <span class="stat-label">最近七天完成情况</span>
      <div class="trend" id="trend" aria-hidden="true"></div>
      <div class="heatmap-wrap">
        <span class="stat-label">最近八周打卡</span>
        <div class="heatmap" id="heatmap" role="img" aria-label="最近八周打卡热力图"></div>
      </div>
    </div>
  </section>

  <main class="layout">
    <aside class="pane goals-pane" aria-label="目标列表">
      <div class="pane-head">
        <h1 class="pane-title">目标</h1>
        <button class="btn btn-primary btn-sm" id="btn-new-goal" type="button">新建目标</button>
      </div>

      <div class="goal-tabs" role="tablist" aria-label="目标视图">
        <button class="tab is-active" type="button" role="tab" data-view="active" aria-selected="true">进行中</button>
        <button class="tab" type="button" role="tab" data-view="archived" aria-selected="false">已归档</button>
      </div>

      <ul class="goal-list" id="goal-list"></ul>

      <div class="empty" id="goal-empty" hidden>
        <p class="empty-title" id="goal-empty-title">还没有目标。从一个这学期想完成的事情开始吧。</p>
        <button class="btn btn-primary" id="btn-empty-new-goal" type="button">新建第一个目标</button>
      </div>

      <div class="pane-foot">
        <button class="link-btn" id="btn-export" type="button">导出备份</button>
        <span class="foot-dot" aria-hidden="true">·</span>
        <button class="link-btn" id="btn-import" type="button">导入备份</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
    </aside>

    <section class="pane tasks-pane" id="tasks-pane" aria-label="任务区">
      <div class="tasks-head">
        <button class="btn btn-ghost back-btn" id="btn-back" type="button">返回目标</button>
        <div class="tasks-title">
          <h2 id="selected-goal-title">还没有选择目标</h2>
          <p class="muted" id="selected-goal-meta"></p>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-new-task" type="button">新建任务</button>
      </div>

      <div class="tasks-progress">
        <div class="progress" id="task-progress" aria-hidden="true">
          <div class="progress-fill" id="task-progress-fill"></div>
        </div>
        <span class="muted" id="task-progress-text">尚未拆解</span>
      </div>

      <div class="task-list" id="task-list"></div>

      <div class="empty" id="task-empty" hidden>
        <p class="empty-title" id="task-empty-title">从左侧选一个目标，或者先新建一个目标。</p>
        <button class="btn btn-primary" id="btn-empty-new-task" type="button">新建任务</button>
      </div>
    </section>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <dialog class="dialog" id="goal-dialog">
    <form id="goal-form" novalidate>
      <h2 class="dialog-title" id="goal-dialog-title">新建目标</h2>
      <label class="field">
        <span class="field-label">目标名称<span class="req" aria-hidden="true">*</span></span>
        <input type="text" id="goal-title" maxlength="60" placeholder="例如：通过英语六级" autocomplete="off">
        <span class="field-hint">60 字以内，不能为空</span>
      </label>
      <label class="field">
        <span class="field-label">描述</span>
        <textarea id="goal-desc" rows="3" maxlength="300" placeholder="为什么想完成它？做到了会怎样？"></textarea>
        <span class="field-hint">300 字以内，可留空</span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">截止日期</span>
          <input type="date" id="goal-due">
        </label>
        <fieldset class="field color-field">
          <legend class="field-label">颜色标签</legend>
          <div class="color-options" id="goal-colors"></div>
        </fieldset>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="task-dialog">
    <form id="task-form" novalidate>
      <h2 class="dialog-title" id="task-dialog-title">新建任务</h2>
      <label class="field">
        <span class="field-label">任务标题<span class="req" aria-hidden="true">*</span></span>
        <input type="text" id="task-title" maxlength="80" placeholder="例如：每天背 30 个单词" autocomplete="off">
        <span class="field-hint">80 字以内</span>
      </label>
      <label class="field">
        <span class="field-label">所属目标<span class="req" aria-hidden="true">*</span></span>
        <select id="task-goal"></select>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">优先级</span>
          <select id="task-priority">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">预计时长</span>
          <select id="task-estimate">
            <option value="">不填写</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">60 分钟</option>
            <option value="90">90 分钟</option>
            <option value="120">120 分钟</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span class="field-label">截止时间</span>
        <input type="datetime-local" id="task-due">
        <span class="field-hint">过期未完成时标题会标红</span>
      </label>
      <p class="dialog-note">完成后的经验值：<strong id="task-exp-hint">20</strong> 点（不填时长按中任务计）</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog dialog-sm" id="confirm-dialog">
    <form id="confirm-form" novalidate>
      <h2 class="dialog-title" id="confirm-title">确认操作</h2>
      <p class="dialog-message" id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" type="submit" id="confirm-ok">确认</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
